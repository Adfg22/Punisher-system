<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إرسال واتساب بالمربعات</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        padding: 20px;
    }
    .box {
        width: 120px;
        height: 120px;
        background-color: #fff;
        margin: 10px;
        border: 2px solid #25D366;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 16px;
        text-align: center;
        transition: transform 0.2s, background-color 0.2s;
    }
    .box:hover {
        transform: scale(1.05);
        background-color: #e0ffe5;
    }
</style>
</head>
<body>

<!-- المربعات -->
<div class="box" data-name="الاسم 1" data-price="50">الاسم 1</div>
<div class="box" data-name="الاسم 2" data-price="75">الاسم 2</div>
<div class="box" data-name="الاسم 3" data-price="100">الاسم 3</div>
<div class="box" data-name="الاسم 4" data-price="120">الاسم 4</div>
<div class="box" data-name="الاسم 5" data-price="200">الاسم 5</div>

<script>
const phone = "+962798315810"; // رقمك

document.querySelectorAll('.box').forEach(box => {
    box.addEventListener('click', () => {
        const name = box.getAttribute('data-name'); // الاسم المخزن
        const price = box.getAttribute('data-price'); // السعر المخزن
        const now = new Date();
        const date = now.toLocaleDateString('ar-EG');
        const time = now.toLocaleTimeString('ar-EG');

        const message = `مرحباً، لدي طلب:\nالاسم: ${name}\nالتاريخ: ${date}\nالوقت: ${time}\nالسعر: ${price}`;

        const url = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(message)}`;

        window.open(url, '_blank');
    });
});
</script>

</body>
</html>
